# Spike: the same small public-site tasks through the browser worker and
# through Cua Driver on one Linux runner. Runs only on this branch, reads no
# secret, and publishes nothing but its own result file.
name: Spike computer comparison

on:
  push:
    branches: [spike/cua-provider]

permissions:
  contents: read

jobs:
  compare:
    name: Browser worker and Cua Driver
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUA_DRIVER_VERSION: 0.34.0
      CUA_DRIVER_SHA256: 629ac96eff829d4dfd5cf221f3f2165c2d813aed91e5efb7b20777a741cd70a7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        timeout-minutes: 8
        run: bun install --frozen-lockfile
      - name: Chromium for the browser worker
        run: bunx playwright install --with-deps chromium
      - name: A display, a window manager and a session bus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb openbox dbus-x11 at-spi2-core
          # Chromium's renderer sandbox needs user namespaces, which this image restricts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # The image ships Chrome's launcher world-writable; Cua Driver refuses such a browser.
          sudo chmod 755 /opt/google/chrome/google-chrome
          ls -l /opt/google/chrome/google-chrome /opt/google/chrome/chrome
      - name: Cua Driver, pinned by checksum
        run: |
          mkdir -p "$RUNNER_TEMP/cua"
          archive="cua-driver-rs-${CUA_DRIVER_VERSION}-linux-x86_64-binary.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/trycua/cua/releases/download/cua-driver-rs-v${CUA_DRIVER_VERSION}/$archive"
          echo "${CUA_DRIVER_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/cua"
          "$RUNNER_TEMP/cua/cua-driver" --version
      - name: Compare
        timeout-minutes: 20
        env:
          DISPLAY: ':99'
          CUA_DRIVER_RS_TELEMETRY_ENABLED: '0'
          CUA_TELEMETRY_ENABLED: '0'
          CUA_DRIVER_RS_UPDATE_CHECK: 'false'
        run: |
          Xvfb :99 -screen 0 1440x1000x24 >/dev/null 2>&1 &
          sleep 2
          openbox >/dev/null 2>&1 &
          sleep 1
          export CUA_DRIVER_BIN="$RUNNER_TEMP/cua/cua-driver"
          dbus-run-session -- bash -c '
            "$CUA_DRIVER_BIN" doctor || true
            CUA_DELIVERY=background bun apps/melete/spike/cua-compare.ts both compare-background.json
            CUA_DELIVERY=foreground bun apps/melete/spike/cua-compare.ts cua compare-foreground.json
          '
      - name: Results
        if: always()
        run: cat compare-*.json || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: spike-compare
          path: compare-*.json
          if-no-files-found: ignore
