# Follows SETUP-WITH-AN-AGENT.md's main path on a clean runner, as a coding
# agent would: the commands come from the guide's own `bash setup` blocks. It
# pulls the published images for main, starts them, checks the status report,
# creates the owner account the way the person would, and removes everything.
# No secret is read. deploy/scripts/setup-guide.test.ts checks this file.
name: Setup guide

on:
  pull_request:
    paths:
      - SETUP-WITH-AN-AGENT.md
      - deploy/**
      - .github/workflows/setup-guide.yml
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: setup-guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guide:
    name: Set up from the guide on a clean machine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Read the main path from the guide
        run: |
          bun run deploy/scripts/setup-guide.ts script > "$RUNNER_TEMP/setup.sh"
          cat "$RUNNER_TEMP/setup.sh"
      - name: Follow it
        run: bash "$RUNNER_TEMP/setup.sh"
      - name: Everything but the model and the account is ready
        run: bun run deploy/scripts/status.ts --json | bun run deploy/scripts/setup-guide.ts expect before
      - name: Create the owner account, as the person does in the browser
        run: |
          password="$(openssl rand -hex 16)"
          curl -fsS -X POST http://127.0.0.1:3101/api/setup \
            -H 'content-type: application/json' \
            -d "{\"email\":\"owner@example.com\",\"password\":\"$password\"}" > /dev/null
      - name: Everything but the model is ready
        run: bun run deploy/scripts/status.ts --json | bun run deploy/scripts/setup-guide.ts expect after
      - name: Following the guide again changes nothing
        run: |
          bash "$RUNNER_TEMP/setup.sh"
          bun run deploy/scripts/status.ts --json | bun run deploy/scripts/setup-guide.ts expect after
      - name: Logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=100
      - name: Remove it
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v --remove-orphans
