[test]
preload = ["./apps/melete/test/helpers/preload.ts"]
maxConcurrency = 2
# The per-test timeout lives in the `test` script rather than here: bun reads no
# `timeout` key from this file, and a setting that is silently ignored is worse
# than none. Run the suite with `bun run test`, or pass `--timeout=30000` when
# invoking `bun test` directly.
