# Add to the base file with -f docker-compose.yml -f docker-compose.browser.yml.
# One worker and one pre-existing space subdirectory; duplicate the deployment
# with distinct control networks to add another space. No control port is published.
networks:
  browser-control:
    driver: bridge
    internal: true
  browser-egress:
    driver: bridge
    internal: false

services:
  melete:
    networks: [edge, internal, browser-control]
    depends_on:
      browser:
        condition: service_healthy
    environment:
      MELETE_BROWSER_URL: http://browser:3132
      MELETE_BROWSER_SPACE: ${MELETE_BROWSER_SPACE:?set MELETE_BROWSER_SPACE in .env}
      MELETE_BROWSER_TOKEN: ${MELETE_BROWSER_TOKEN:?set MELETE_BROWSER_TOKEN in .env}

  browser:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.browser
    restart: unless-stopped
    # The same bound as the base file's services; an anchor cannot cross files.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    init: true
    networks: [browser-control, browser-egress]
    user: "10003:10003"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 384
    mem_limit: 2g
    shm_size: 256m
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 20s
    environment:
      MELETE_BROWSER_SPACE: ${MELETE_BROWSER_SPACE:?set MELETE_BROWSER_SPACE in .env}
      MELETE_BROWSER_ROOT: /space
      MELETE_BROWSER_TOKEN: ${MELETE_BROWSER_TOKEN:?set MELETE_BROWSER_TOKEN in .env}
      MELETE_BROWSER_HOST: 0.0.0.0
      MELETE_BROWSER_PORT: "3132"
      PLAYWRIGHT_BROWSERS_PATH: /opt/chromium
    volumes:
      - type: volume
        source: spaces
        target: /space
        read_only: false
        volume:
          nocopy: true
          subpath: ${MELETE_BROWSER_SPACE:?set MELETE_BROWSER_SPACE in .env}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3132/health',{headers:{authorization:'Bearer '+process.env.MELETE_BROWSER_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
