# Melete, self-hosted. `docker compose up` from this directory.
#
# The shape of this file is the security boundary. The runtime container is
# attached only to `internal`, which is declared `internal: true`, so the kernel
# gives it no default route. The Melete broker is the only peer it can reach.
# Scenario 6 of the conformance suite asserts exactly that from inside the
# container: the internet, the Postgres port, the host metadata address, and a
# sibling path are all unreachable.

name: melete

networks:
  # Reachable from the host: the web client and the API.
  edge:
    driver: bridge
  # No route out. Everything the runtime can see lives here.
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  spaces:
  artifacts:
  work:
  # HERMES_HOME. The root filesystem is read-only, but the API server's
  # run-idempotency reservations are a SQLite file under HERMES_HOME: without a
  # writable path the store falls back to process memory, /v1/capabilities
  # reports runs_idempotency.durable=false, and the adapter refuses to start
  # rather than risk a retried start becoming a second run. The entrypoint syncs
  # the image's config and plugin into this volume on every boot, so an upgraded
  # image wins over whatever an older container left here.
  runtime-home:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-melete}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-melete}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-melete}"]
      interval: 10s
      timeout: 5s
      retries: 10

  melete:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.melete
    restart: unless-stopped
    # On edge to serve the API, on internal to reach Postgres and to be the
    # runtime's only peer.
    networks: [edge, internal]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      MELETE_MASTER_KEY: ${MELETE_MASTER_KEY:?set MELETE_MASTER_KEY in .env}
      MELETE_CAPABILITY_KEY: ${MELETE_CAPABILITY_KEY:?set MELETE_CAPABILITY_KEY in .env}
      MELETE_APPROVAL_KEY: ${MELETE_APPROVAL_KEY:?set MELETE_APPROVAL_KEY in .env}
      MELETE_SPACES_DIR: /data/spaces
      MELETE_ARTIFACTS_DIR: /data/artifacts
      MELETE_BROKER_BIND: 0.0.0.0:8788
      MELETE_WORK_DIR: /work
      MELETE_CONNECTIONS_FILE: /etc/melete/connections.json
      MELETE_GATEWAY_TLS_DIR: /etc/melete/gateway-tls
      MELETE_RUNTIME_URL: http://runtime:8790
      MELETE_RUNTIME_KEY: ${MELETE_RUNTIME_KEY:?set MELETE_RUNTIME_KEY in .env}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
    volumes:
      - spaces:/data/spaces
      - artifacts:/data/artifacts
      - work:/work
      - ./config:/etc/melete:ro
    ports:
      - "${MELETE_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8787/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  runtime:
    build:
      context: ../packages/runtime-hermes
      dockerfile: Dockerfile
    restart: unless-stopped
    # The whole point: internal only. Adding `edge` here would undo the boundary
    # this release claims, and the compose check refuses it.
    networks: [internal]
    depends_on:
      melete:
        condition: service_started
    environment:
      MELETE_BROKER_URL: http://melete:8788
      HTTP_PROXY: http://melete:8788
      HTTPS_PROXY: http://melete:8788
      NO_PROXY: melete,localhost,127.0.0.1
      HERMES_EXEC_ASK: "1"
      HERMES_HOME: /var/lib/hermes
      API_SERVER_ENABLED: "1"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8790"
      # Not optional. Without a usable key the api_server platform is never
      # enabled at all (gateway/config_env.py:_api_server returns early), so the
      # container starts, logs nothing alarming, and never listens.
      API_SERVER_KEY: ${MELETE_RUNTIME_KEY:?set MELETE_RUNTIME_KEY in .env}
      # The surrogate the gateway swaps for a real provider key.
      MELETE_MODEL_KEY: ${MELETE_RUNTIME_MODEL_KEY:?set MELETE_RUNTIME_MODEL_KEY in .env}
      # Per attempt, and required: the entrypoint refuses to start without them.
      # A long-lived container is a placeholder for the per-attempt container the
      # service will start once W1 owns the lifecycle; these are the values it
      # will pass, and the ones the local end-to-end passes today.
      MELETE_ATTEMPT_TOKEN: ${MELETE_ATTEMPT_TOKEN:-}
      MELETE_ATTEMPT_ID: ${MELETE_ATTEMPT_ID:-}
      MELETE_JOB_ID: ${MELETE_JOB_ID:-}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      # The only writable paths. /work is shared with the service; the Hermes
      # home holds the idempotency reservations and nothing else that matters.
      - work:/work
      - runtime-home:/var/lib/hermes

  # apps/web is a small reference client for the API, not the product interface,
  # so it sits behind a profile: `docker compose up` brings up the service, and
  # `docker compose --profile web up` adds a browsable client on top of it.
  #
  # The API address is a build argument, not an environment variable, because
  # Vite inlines it into the bundle. Changing it means rebuilding the image.
  web:
    profiles: [web]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_MELETE_API: ${MELETE_API_URL:-http://localhost:8787}
    restart: unless-stopped
    networks: [edge]
    depends_on:
      melete:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
