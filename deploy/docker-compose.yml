# Linux deployment. Run from the repository root using the README commands.
#
# The four Melete images are built here from source and named melete-*:local.
# The service image also runs melete-cells and the database-roles step.
# With MELETE_IMAGE_TAG set (deploy/.env), the same services name the published
# images instead, ghcr.io/ychampion/melete-*:<tag> or MELETE_IMAGE_REGISTRY's,
# which `docker compose pull` fetches and `up --no-build` starts without a build
# (docs/DEPLOYMENT.md, "Using prebuilt images").
name: ${COMPOSE_PROJECT_NAME:-melete}

# Docker's default log has no size limit. Every service rotates a bounded
# json-file instead; attempt containers get the same limits from the supervisor.
x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  edge:
    driver: bridge
  database:
    driver: bridge
    internal: true
  # A warm capability/probe cell. Actual attempts get separate networks with
  # these same settings and only the trusted Melete service as a peer. Its
  # name is <project>_internal, so installations on one host stay apart.
  internal:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
  # The service's one way to the Docker engine: melete-cells holds the socket and
  # answers only the service, here, with the fixed container profiles.
  cells:
    driver: bridge
    internal: true

volumes:
  pgdata:
  spaces:
  artifacts:
  work:
  runtime-home:
  # Keep this independently of database snapshots: removals must survive restore.
  restrictions:
  # The service's two database addresses, written by database-roles on every start.
  database-access:
  # The key the service presents to melete-cells, written by melete-cells once.
  cells-key:

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    logging: *bounded-logs
    networks: [database]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-melete}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run bun run deploy/scripts/configure.ts}
      POSTGRES_DB: ${POSTGRES_DB:-melete}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-melete} -d ${POSTGRES_DB:-melete}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Runs before the service on every start, with the operator's DATABASE_URL:
  # creates the database roles, hands the schema to melete_migrate, runs every
  # migration as it, grants, and writes the service's two addresses into
  # database-access. The service is never given DATABASE_URL itself, and its
  # own role cannot read the secret table (docs/DEPLOYMENT.md, "Database roles").
  database-roles:
    image: "${MELETE_IMAGE_TAG:+${MELETE_IMAGE_REGISTRY:-ghcr.io/ychampion}/}melete-service:${MELETE_IMAGE_TAG:-local}"
    restart: "no"
    logging: *bounded-logs
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?run bun run deploy/scripts/configure.ts}
      MELETE_DATABASE_ACCESS_DIR: /data/database-access
      # The demonstration's test connector keeps a table, made here by the schema's owner.
      MELETE_ENABLE_TEST_CONNECTOR: ${MELETE_ENABLE_TEST_CONNECTOR:-false}
      # Set all three only where the database's administrator made the roles.
      MELETE_MIGRATE_DATABASE_URL: ${MELETE_MIGRATE_DATABASE_URL:-}
      MELETE_API_DATABASE_URL: ${MELETE_API_DATABASE_URL:-}
      MELETE_EFFECTS_DATABASE_URL: ${MELETE_EFFECTS_DATABASE_URL:-}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - database-access:/data/database-access
    command: ["bun", "run", "apps/melete/src/db/roles-main.ts"]

  # The only holder of the Docker socket. It starts attempt cells, agents'
  # computers and stdio MCP servers from fixed profiles, for the service alone,
  # and refuses any other image, mount, privilege or network. It has no
  # database address and no service key.
  melete-cells:
    image: "${MELETE_IMAGE_TAG:+${MELETE_IMAGE_REGISTRY:-ghcr.io/ychampion}/}melete-service:${MELETE_IMAGE_TAG:-local}"
    restart: unless-stopped
    logging: *bounded-logs
    networks: [cells]
    environment:
      MELETE_DOCKER_SOCKET: /var/run/docker.sock
      MELETE_CELLS_BIND: 0.0.0.0:8791
      MELETE_CELLS_KEY_FILE: /data/cells-key/key
      MELETE_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-melete}
      MELETE_WORK_VOLUME: ${COMPOSE_PROJECT_NAME:-melete}_work
      MELETE_RUNTIME_IMAGE: "${MELETE_IMAGE_TAG:+${MELETE_IMAGE_REGISTRY:-ghcr.io/ychampion}/}melete-runtime:${MELETE_IMAGE_TAG:-local}"
      MELETE_SANDBOX_PROJECT: ${MELETE_SANDBOX_PROJECT:-}
      MELETE_SANDBOX_DOCKER_IMAGE: "${MELETE_SANDBOX_DOCKER_IMAGE:-${MELETE_IMAGE_TAG:+${MELETE_IMAGE_REGISTRY:-ghcr.io/ychampion}/}melete-sandbox:${MELETE_IMAGE_TAG:-local}}"
      MELETE_MCP_NODE_IMAGE: ${MELETE_MCP_NODE_IMAGE:-}
      MELETE_MCP_PYTHON_IMAGE: ${MELETE_MCP_PYTHON_IMAGE:-}
    group_add: ["${DOCKER_GID:?run bun run deploy/scripts/configure.ts}"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - cells-key:/data/cells-key
      # The cell service only. No other service and no cell is given this socket.
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["bun", "run", "apps/melete/src/cells/main.ts"]
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:8791/health')).ok?0:1)"]
      interval: 2s
      timeout: 5s
      start_period: 30s
      retries: 30

  melete:
    image: "${MELETE_IMAGE_TAG:+${MELETE_IMAGE_REGISTRY:-ghcr.io/ychampion}/}melete-service:${MELETE_IMAGE_TAG:-local}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile.melete
    restart: unless-stopped
    logging: *bounded-logs
    networks:
      edge:
        aliases: [melete-api]
        gw_priority: 1
      database: {}
      internal: {}
      cells: {}
    depends_on:
      postgres:
        condition: service_healthy
      runtime-image:
        condition: service_completed_successfully
      database-roles:
        condition: service_completed_successfully
      melete-cells:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      MELETE_API_BIND: melete-api
      # The only peer believed about a browser's address, for login limits.
      MELETE_TRUSTED_PROXY: web
      # Its own role, which cannot read the secret table, and the effects role,
      # which can, as database-roles wrote them. Never the operator's address.
      DATABASE_URL_FILE: /data/database-access/api.url
      MELETE_EFFECTS_DATABASE_URL_FILE: /data/database-access/effects.url
      # The engine, through the cell service; the service has no socket.
      MELETE_CELLS_URL: http://melete-cells:8791
      MELETE_CELLS_KEY_FILE: /data/cells-key/key
      MELETE_MASTER_KEY: ${MELETE_MASTER_KEY:?run bun run deploy/scripts/configure.ts}
      MELETE_CAPABILITY_KEY: ${MELETE_CAPABILITY_KEY:?run bun run deploy/scripts/configure.ts}
      MELETE_APPROVAL_KEY: ${MELETE_APPROVAL_KEY:?run bun run deploy/scripts/configure.ts}
      MELETE_SPACES_DIR: /data/spaces
      MELETE_ARTIFACTS_DIR: /data/artifacts
      # Blobs stay on the artifacts volume unless MELETE_BLOB_STORE=s3 names a bucket.
      MELETE_BLOB_STORE: ${MELETE_BLOB_STORE:-}
      MELETE_BLOB_S3_ENDPOINT: ${MELETE_BLOB_S3_ENDPOINT:-}
      MELETE_BLOB_S3_BUCKET: ${MELETE_BLOB_S3_BUCKET:-}
      MELETE_BLOB_S3_REGION: ${MELETE_BLOB_S3_REGION:-}
      MELETE_BLOB_S3_PREFIX: ${MELETE_BLOB_S3_PREFIX:-}
      MELETE_BLOB_S3_ACCESS_KEY_ID: ${MELETE_BLOB_S3_ACCESS_KEY_ID:-}
      MELETE_BLOB_S3_SECRET_ACCESS_KEY: ${MELETE_BLOB_S3_SECRET_ACCESS_KEY:-}
      MELETE_RESTRICTIONS_DIR: /data/restrictions
      MELETE_BROKER_BIND: 0.0.0.0:8788
      # The service reads each attempt's tool catalog from its own broker listener.
      MELETE_BROKER_URL: http://melete:8788
      MELETE_WORK_DIR: /work
      MELETE_CONNECTIONS_FILE: /etc/melete/connections.json
      MELETE_GATEWAY_TLS_DIR: /etc/melete/gateway-tls
      MELETE_RUNTIME_ADAPTER: docker
      MELETE_RUNTIME_URL: http://runtime:8790
      MELETE_RUNTIME_KEY: ${MELETE_RUNTIME_KEY:?run bun run deploy/scripts/configure.ts}
      MELETE_RUNTIME_IMAGE: "${MELETE_IMAGE_TAG:+${MELETE_IMAGE_REGISTRY:-ghcr.io/ychampion}/}melete-runtime:${MELETE_IMAGE_TAG:-local}"
      MELETE_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-melete}
      MELETE_WORK_VOLUME: ${COMPOSE_PROJECT_NAME:-melete}_work
      MELETE_DEFAULT_PROVIDER: ${MELETE_DEFAULT_PROVIDER:-fireworks}
      MELETE_DEFAULT_MODEL: ${MELETE_DEFAULT_MODEL:-accounts/fireworks/models/deepseek-v4p1-flash}
      MELETE_DEFAULT_MODEL_VISION: ${MELETE_DEFAULT_MODEL_VISION:-}
      MELETE_DEFAULT_MODEL_NATIVE_SEARCH: ${MELETE_DEFAULT_MODEL_NATIVE_SEARCH:-}
      # Web search (docs/CONNECTORS.md, "Web search"). Empty searches with the model's own
      # search where it has one, and without a key otherwise.
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MELETE_DEFAULT_MAX_OUTPUT_TOKENS: ${MELETE_DEFAULT_MAX_OUTPUT_TOKENS:-4096}
      # Left empty, the service's own defaults apply (docs/DEPLOYMENT.md, "Engine limits").
      MELETE_ENGINE_MAX_TURNS: ${MELETE_ENGINE_MAX_TURNS:-}
      MELETE_COMPACTION_MAX_TOKENS: ${MELETE_COMPACTION_MAX_TOKENS:-}
      MELETE_MODEL_CONTEXT_WINDOW: ${MELETE_MODEL_CONTEXT_WINDOW:-}
      # Automatic memory (docs/DEPLOYMENT.md, "Memory model"). Empty uses the default model.
      MELETE_MEMORY_MODEL: ${MELETE_MEMORY_MODEL:-}
      MELETE_MEMORY_PROVIDER: ${MELETE_MEMORY_PROVIDER:-}
      MELETE_MEMORY_DAILY_CALLS: ${MELETE_MEMORY_DAILY_CALLS:-200}
      # Semantic recall (docs/DEPLOYMENT.md, "Semantic recall"). Empty uses the default provider's embedding model.
      MELETE_EMBEDDING_PROVIDER: ${MELETE_EMBEDDING_PROVIDER:-}
      MELETE_EMBEDDING_MODEL: ${MELETE_EMBEDDING_MODEL:-}
      MELETE_EMBEDDING_DIMENSIONS: ${MELETE_EMBEDDING_DIMENSIONS:-}
      # Auto-review of reversible actions (docs/DEPLOYMENT.md, "Auto-review"). Empty uses the default model.
      MELETE_REVIEW_MODEL: ${MELETE_REVIEW_MODEL:-}
      MELETE_REVIEW_PROVIDER: ${MELETE_REVIEW_PROVIDER:-}
      MELETE_REVIEW_TIMEOUT_MS: ${MELETE_REVIEW_TIMEOUT_MS:-12000}
      MELETE_REVIEW_HOURLY_LIMIT: ${MELETE_REVIEW_HOURLY_LIMIT:-60}
      # Spending caps on model calls (docs/DEPLOYMENT.md, "Spending caps"). Empty is no limit.
      MELETE_SPEND_MONTHLY_USD: ${MELETE_SPEND_MONTHLY_USD:-}
      MELETE_SPEND_DAILY_USD: ${MELETE_SPEND_DAILY_USD:-}
      MELETE_SPEND_PERSON_MONTHLY_USD: ${MELETE_SPEND_PERSON_MONTHLY_USD:-}
      MELETE_SPEND_PERSON_DAILY_USD: ${MELETE_SPEND_PERSON_DAILY_USD:-}
      MELETE_SPEND_MONTHLY_TOKENS: ${MELETE_SPEND_MONTHLY_TOKENS:-}
      MELETE_SPEND_DAILY_TOKENS: ${MELETE_SPEND_DAILY_TOKENS:-}
      MELETE_SPEND_PERSON_MONTHLY_TOKENS: ${MELETE_SPEND_PERSON_MONTHLY_TOKENS:-}
      MELETE_SPEND_PERSON_DAILY_TOKENS: ${MELETE_SPEND_PERSON_DAILY_TOKENS:-}
      MELETE_SPEND_NOTICE_PERCENT: ${MELETE_SPEND_NOTICE_PERCENT:-}
      MELETE_MODEL_PRICES: ${MELETE_MODEL_PRICES:-}
      MELETE_ATTACHMENT_MAX_MB: ${MELETE_ATTACHMENT_MAX_MB:-}
      MELETE_ATTACHMENTS_PER_MESSAGE: ${MELETE_ATTACHMENTS_PER_MESSAGE:-}
      MELETE_ATTACHMENT_UPLOADS_AT_ONCE: ${MELETE_ATTACHMENT_UPLOADS_AT_ONCE:-}
      MELETE_ATTACHMENT_UPLOADS_PER_WINDOW: ${MELETE_ATTACHMENT_UPLOADS_PER_WINDOW:-}
      MELETE_ATTACHMENT_UPLOAD_WINDOW_MINUTES: ${MELETE_ATTACHMENT_UPLOAD_WINDOW_MINUTES:-}
      MELETE_ATTACHMENT_SERVER_UPLOADS: ${MELETE_ATTACHMENT_SERVER_UPLOADS:-}
      MELETE_ATTACHMENT_SERVER_UPLOAD_MB: ${MELETE_ATTACHMENT_SERVER_UPLOAD_MB:-}
      # Model routing and reasoning effort (docs/DEPLOYMENT.md, "Model routing").
      MELETE_MODEL_FAST: ${MELETE_MODEL_FAST:-}
      MELETE_MODEL_VISION: ${MELETE_MODEL_VISION:-}
      MELETE_MODEL_FALLBACK: ${MELETE_MODEL_FALLBACK:-}
      MELETE_REASONING_EFFORT_AGENT: ${MELETE_REASONING_EFFORT_AGENT:-}
      MELETE_REASONING_EFFORT_SIDE: ${MELETE_REASONING_EFFORT_SIDE:-}
      # Operator alerts (docs/DEPLOYMENT.md, "Alerts").
      MELETE_ALERT_WEBHOOK_URL: ${MELETE_ALERT_WEBHOOK_URL:-}
      MELETE_ALERT_EMAIL_TO: ${MELETE_ALERT_EMAIL_TO:-}
      MELETE_ALERT_EMAIL_FROM: ${MELETE_ALERT_EMAIL_FROM:-}
      MELETE_ALERT_SMTP_URL: ${MELETE_ALERT_SMTP_URL:-}
      MELETE_ALERT_INTERVAL_SECONDS: ${MELETE_ALERT_INTERVAL_SECONDS:-}
      MELETE_ALERT_REPEAT_MINUTES: ${MELETE_ALERT_REPEAT_MINUTES:-}
      MELETE_OPERATOR_TOKEN: ${MELETE_OPERATOR_TOKEN:-}
      MELETE_PUBLIC_URL: ${MELETE_PUBLIC_URL:-}
      MELETE_OAUTH_CLIENT_METADATA: ${MELETE_OAUTH_CLIENT_METADATA:-}
      # Signing in with Google for Gmail and Google Calendar (docs/mail-calendar.md).
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Signing in with Microsoft for Outlook mail and calendar (docs/mail-calendar.md).
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_TENANT: ${MICROSOFT_OAUTH_TENANT:-}
      # Web Push to phones and browsers (docs/DEPLOYMENT.md, "Phone notifications").
      MELETE_VAPID_PUBLIC_KEY: ${MELETE_VAPID_PUBLIC_KEY:-}
      MELETE_VAPID_PRIVATE_KEY: ${MELETE_VAPID_PRIVATE_KEY:-}
      MELETE_VAPID_SUBJECT: ${MELETE_VAPID_SUBJECT:-}
      MELETE_PUSH_EXTRA_ORIGINS: ${MELETE_PUSH_EXTRA_ORIGINS:-}
      # The company map's model and its daily allowance (docs/DEPLOYMENT.md, "Company map").
      MELETE_COMPANIES_MODEL: ${MELETE_COMPANIES_MODEL:-}
      MELETE_COMPANIES_PROVIDER: ${MELETE_COMPANIES_PROVIDER:-}
      MELETE_COMPANIES_DAILY_CALLS: ${MELETE_COMPANIES_DAILY_CALLS:-}
      # Sandboxes (docs/DEPLOYMENT.md, "Sandboxes"). Empty uses each default.
      MELETE_SANDBOX_PROJECT: ${MELETE_SANDBOX_PROJECT:-}
      MELETE_SANDBOX_LEASE_SECONDS: ${MELETE_SANDBOX_LEASE_SECONDS:-}
      MELETE_SANDBOX_MAX_CONCURRENT: ${MELETE_SANDBOX_MAX_CONCURRENT:-}
      MELETE_SANDBOX_MAX_CONCURRENT_PER_CONNECTION: ${MELETE_SANDBOX_MAX_CONCURRENT_PER_CONNECTION:-}
      MELETE_SANDBOX_WORKSPACE_RETENTION_SECONDS: ${MELETE_SANDBOX_WORKSPACE_RETENTION_SECONDS:-}
      MELETE_SANDBOX_SNAPSHOT_TTL_SECONDS: ${MELETE_SANDBOX_SNAPSHOT_TTL_SECONDS:-}
      MELETE_SANDBOX_ALLOW_PROXY_ENVIRONMENT: ${MELETE_SANDBOX_ALLOW_PROXY_ENVIRONMENT:-}
      MELETE_PROCESS_MAX_PER_COMPUTER: ${MELETE_PROCESS_MAX_PER_COMPUTER:-}
      MELETE_PROCESS_MAX_PER_SPACE: ${MELETE_PROCESS_MAX_PER_SPACE:-}
      MELETE_PROCESS_DEFAULT_TTL_MINUTES: ${MELETE_PROCESS_DEFAULT_TTL_MINUTES:-}
      MELETE_PROCESS_MAX_TTL_MINUTES: ${MELETE_PROCESS_MAX_TTL_MINUTES:-}
      MELETE_PROCESS_OUTPUT_MAX_BYTES: ${MELETE_PROCESS_OUTPUT_MAX_BYTES:-}
      MELETE_SANDBOX_AWAKE_SECONDS_PER_DAY: ${MELETE_SANDBOX_AWAKE_SECONDS_PER_DAY:-}
      MELETE_E2B_PLAN: ${MELETE_E2B_PLAN:-}
      # Voice (docs/VOICE.md). Empty leaves voice off, and each default in place.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_SECOND_VOICE_ID: ${ELEVENLABS_SECOND_VOICE_ID:-}
      ELEVENLABS_SPEECH_MODEL: ${ELEVENLABS_SPEECH_MODEL:-}
      ELEVENLABS_STREAMING_MODEL: ${ELEVENLABS_STREAMING_MODEL:-}
      ELEVENLABS_TRANSCRIPTION_MODEL: ${ELEVENLABS_TRANSCRIPTION_MODEL:-}
      MELETE_VOICE_DAILY_SECONDS: ${MELETE_VOICE_DAILY_SECONDS:-}
      MELETE_VOICE_DAILY_CHARACTERS: ${MELETE_VOICE_DAILY_CHARACTERS:-}
      MELETE_VOICE_DAILY_SESSIONS: ${MELETE_VOICE_DAILY_SESSIONS:-}
      # A computer for every agent on this engine (docs/sandbox-docker.md). Set
      # MELETE_SANDBOX_PROVIDER=docker with MELETE_SANDBOX_PROJECT, and build the
      # image with --profile sandbox.
      MELETE_SANDBOX_PROVIDER: ${MELETE_SANDBOX_PROVIDER:-}
      MELETE_SANDBOX_DOCKER_IMAGE: "${MELETE_SANDBOX_DOCKER_IMAGE:-${MELETE_IMAGE_TAG:+${MELETE_IMAGE_REGISTRY:-ghcr.io/ychampion}/}melete-sandbox:${MELETE_IMAGE_TAG:-local}}"
      MELETE_SANDBOX_DOCKER_CPUS: ${MELETE_SANDBOX_DOCKER_CPUS:-}
      MELETE_SANDBOX_DOCKER_MEMORY_MB: ${MELETE_SANDBOX_DOCKER_MEMORY_MB:-}
      MELETE_SANDBOX_DOCKER_PIDS: ${MELETE_SANDBOX_DOCKER_PIDS:-}
      MELETE_SANDBOX_DOCKER_DISK_MB: ${MELETE_SANDBOX_DOCKER_DISK_MB:-}
      MELETE_SANDBOX_DOCKER_EGRESS: ${MELETE_SANDBOX_DOCKER_EGRESS:-}
      MELETE_SANDBOX_DOCKER_IDLE_SECONDS: ${MELETE_SANDBOX_DOCKER_IDLE_SECONDS:-}
      MELETE_SANDBOX_EGRESS_PORT: ${MELETE_SANDBOX_EGRESS_PORT:-}
      MELETE_SANDBOX_EGRESS_EXTRA_HOSTS: ${MELETE_SANDBOX_EGRESS_EXTRA_HOSTS:-}
      MELETE_EGRESS_RECORD_DAYS: ${MELETE_EGRESS_RECORD_DAYS:-}
      MELETE_EGRESS_HOLD_MAX_BYTES: ${MELETE_EGRESS_HOLD_MAX_BYTES:-}
      MELETE_EGRESS_APPROVAL_HOLD_SECONDS: ${MELETE_EGRESS_APPROVAL_HOLD_SECONDS:-}
      # Plugin runners (docs/DEPLOYMENT.md, "Isolation and image provenance"). Empty uses each default.
      MELETE_MCP_NODE_IMAGE: ${MELETE_MCP_NODE_IMAGE:-}
      MELETE_MCP_PYTHON_IMAGE: ${MELETE_MCP_PYTHON_IMAGE:-}
      MELETE_MCP_EGRESS_PORT: ${MELETE_MCP_EGRESS_PORT:-}
      MELETE_MCP_IDLE_MS: ${MELETE_MCP_IDLE_MS:-}
      # How long an attempt's container may take to start (default 120000 ms).
      MELETE_RUNTIME_START_TIMEOUT_MS: ${MELETE_RUNTIME_START_TIMEOUT_MS:-}
      # Engines kept loaded ahead of the next attempts (default 1), and attempts run at once (default 4).
      MELETE_ENGINE_PREWARM: ${MELETE_ENGINE_PREWARM:-}
      MELETE_ATTEMPT_CONCURRENCY: ${MELETE_ATTEMPT_CONCURRENCY:-}
      # The text-to-speech model, when an OpenAI or OpenAI-compatible key is set.
      MELETE_SPEECH_MODEL: ${MELETE_SPEECH_MODEL:-}
      MELETE_ENABLE_FAKE_PROVIDER: ${MELETE_ENABLE_FAKE_PROVIDER:-false}
      MELETE_ENABLE_TEST_CONNECTOR: ${MELETE_ENABLE_TEST_CONNECTOR:-false}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      MELETE_CHATGPT_CLIENT_ID: ${MELETE_CHATGPT_CLIENT_ID:-}
      OPENAI_COMPAT_OAUTH_ISSUER: ${OPENAI_COMPAT_OAUTH_ISSUER:-}
      OPENAI_COMPAT_OAUTH_AUTHORIZE_URL: ${OPENAI_COMPAT_OAUTH_AUTHORIZE_URL:-}
      OPENAI_COMPAT_OAUTH_TOKEN_URL: ${OPENAI_COMPAT_OAUTH_TOKEN_URL:-}
      OPENAI_COMPAT_OAUTH_REVOKE_URL: ${OPENAI_COMPAT_OAUTH_REVOKE_URL:-}
      OPENAI_COMPAT_OAUTH_CLIENT_ID: ${OPENAI_COMPAT_OAUTH_CLIENT_ID:-}
      OPENAI_COMPAT_OAUTH_CLIENT_SECRET: ${OPENAI_COMPAT_OAUTH_CLIENT_SECRET:-}
      OPENAI_COMPAT_OAUTH_SCOPES: ${OPENAI_COMPAT_OAUTH_SCOPES:-}
      OPENAI_COMPAT_OAUTH_REDIRECT_URL: ${OPENAI_COMPAT_OAUTH_REDIRECT_URL:-}
      OPENAI_COMPAT_OAUTH_LABEL: ${OPENAI_COMPAT_OAUTH_LABEL:-}
    group_add: ["10001"]
    volumes:
      - spaces:/data/spaces
      - artifacts:/data/artifacts
      - work:/work
      - restrictions:/data/restrictions
      - ./config:/etc/melete:ro
      - database-access:/data/database-access:ro
      - cells-key:/data/cells-key:ro
    ports:
      - "127.0.0.1:${MELETE_PORT:-3100}:8787"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://melete-api:8787/health');const b=await r.json();process.exit(r.ok&&b.database==='ok'?0:1)"]
      interval: 2s
      timeout: 5s
      start_period: 30s
      retries: 30
    stop_grace_period: 40s

  # Builds the runtime image (or holds the pulled one) before the service can
  # launch an attempt from it. Nothing runs here: no engine, no credential, no
  # network.
  runtime-image:
    image: "${MELETE_IMAGE_TAG:+${MELETE_IMAGE_REGISTRY:-ghcr.io/ychampion}/}melete-runtime:${MELETE_IMAGE_TAG:-local}"
    build:
      context: ../packages/runtime-hermes
      dockerfile: Dockerfile
    entrypoint: ["/bin/true"]
    network_mode: none
    restart: "no"
    logging: *bounded-logs

  # Builds the agents' computer image, only with --profile sandbox: it is large
  # (a desktop and a browser) and only a docker sandbox provider uses it. The
  # service starts one container per agent from it; nothing runs here.
  sandbox-image:
    image: "${MELETE_SANDBOX_DOCKER_IMAGE:-${MELETE_IMAGE_TAG:+${MELETE_IMAGE_REGISTRY:-ghcr.io/ychampion}/}melete-sandbox:${MELETE_IMAGE_TAG:-local}}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sandbox
    profiles: [sandbox]
    entrypoint: ["/bin/true"]
    network_mode: none
    restart: "no"
    logging: *bounded-logs

  runtime:
    image: "${MELETE_IMAGE_TAG:+${MELETE_IMAGE_REGISTRY:-ghcr.io/ychampion}/}melete-runtime:${MELETE_IMAGE_TAG:-local}"
    restart: unless-stopped
    logging: *bounded-logs
    networks: [internal]
    depends_on:
      runtime-image:
        condition: service_completed_successfully
      melete:
        condition: service_healthy
    environment:
      MELETE_BROKER_URL: http://melete:8788
      HTTP_PROXY: http://melete:8788
      HTTPS_PROXY: http://melete:8788
      NO_PROXY: melete,localhost,127.0.0.1
      HERMES_EXEC_ASK: "1"
      HERMES_HOME: /var/lib/hermes
      API_SERVER_ENABLED: "1"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8790"
      API_SERVER_KEY: ${MELETE_RUNTIME_KEY:?run bun run deploy/scripts/configure.ts}
      # This warm cell has no valid capability and cannot act on a job.
      MELETE_MODEL_KEY: melete-surrogate-probe
      MELETE_ATTEMPT_TOKEN: probe-without-authority
      MELETE_ATTEMPT_ID: att_probe
      MELETE_JOB_ID: job_probe
      MELETE_MODEL_PROVIDER: ${MELETE_DEFAULT_PROVIDER:-fireworks}
      MELETE_MODEL_NAME: ${MELETE_DEFAULT_MODEL:-accounts/fireworks/models/deepseek-v4p1-flash}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: volume
        source: work
        target: /work
        volume:
          nocopy: true
          subpath: _probe
      - runtime-home:/var/lib/hermes
    healthcheck:
      test: ["CMD", "python", "/opt/melete-runtime/healthcheck.py"]
      interval: 2s
      timeout: 5s
      start_period: 60s
      retries: 30

  web:
    image: "${MELETE_IMAGE_TAG:+${MELETE_IMAGE_REGISTRY:-ghcr.io/ychampion}/}melete-web:${MELETE_IMAGE_TAG:-local}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_MELETE_API: /api
    restart: unless-stopped
    logging: *bounded-logs
    networks: [edge]
    depends_on:
      melete:
        condition: service_healthy
    environment:
      MELETE_WEB_ORIGIN: ${MELETE_WEB_ORIGIN:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3101}:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:3000/')).ok?0:1)"]
      interval: 2s
      timeout: 5s
      retries: 30
