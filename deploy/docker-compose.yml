# Linux deployment. Run from the repository root using the README commands.
name: ${COMPOSE_PROJECT_NAME:-melete}

# Docker's default log has no size limit. Every service rotates a bounded
# json-file instead; attempt containers get the same limits from the supervisor.
x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  edge:
    driver: bridge
  database:
    driver: bridge
    internal: true
  # A warm capability/probe cell. Actual attempts get separate networks with
  # these same settings and only the trusted Melete service as a peer. Its
  # name is <project>_internal, so installations on one host stay apart.
  internal:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated

volumes:
  pgdata:
  spaces:
  artifacts:
  work:
  runtime-home:
  # Keep this independently of database snapshots: removals must survive restore.
  restrictions:

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    logging: *bounded-logs
    networks: [database]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-melete}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run bun run deploy/scripts/configure.ts}
      POSTGRES_DB: ${POSTGRES_DB:-melete}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-melete} -d ${POSTGRES_DB:-melete}"]
      interval: 2s
      timeout: 5s
      retries: 30

  melete:
    image: melete-service:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.melete
    restart: unless-stopped
    logging: *bounded-logs
    networks:
      edge:
        aliases: [melete-api]
        gw_priority: 1
      database: {}
      internal: {}
    depends_on:
      postgres:
        condition: service_healthy
      runtime-image:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 8787
      MELETE_API_BIND: melete-api
      # The only peer believed about a browser's address, for login limits.
      MELETE_TRUSTED_PROXY: web
      DATABASE_URL: ${DATABASE_URL:?run bun run deploy/scripts/configure.ts}
      MELETE_MASTER_KEY: ${MELETE_MASTER_KEY:?run bun run deploy/scripts/configure.ts}
      MELETE_CAPABILITY_KEY: ${MELETE_CAPABILITY_KEY:?run bun run deploy/scripts/configure.ts}
      MELETE_APPROVAL_KEY: ${MELETE_APPROVAL_KEY:?run bun run deploy/scripts/configure.ts}
      MELETE_SPACES_DIR: /data/spaces
      MELETE_ARTIFACTS_DIR: /data/artifacts
      MELETE_RESTRICTIONS_DIR: /data/restrictions
      MELETE_BROKER_BIND: 0.0.0.0:8788
      # The service reads each attempt's tool catalog from its own broker listener.
      MELETE_BROKER_URL: http://melete:8788
      MELETE_WORK_DIR: /work
      MELETE_CONNECTIONS_FILE: /etc/melete/connections.json
      MELETE_GATEWAY_TLS_DIR: /etc/melete/gateway-tls
      MELETE_RUNTIME_ADAPTER: docker
      MELETE_RUNTIME_URL: http://runtime:8790
      MELETE_RUNTIME_KEY: ${MELETE_RUNTIME_KEY:?run bun run deploy/scripts/configure.ts}
      MELETE_RUNTIME_IMAGE: melete-runtime:local
      MELETE_DOCKER_SOCKET: /var/run/docker.sock
      MELETE_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-melete}
      MELETE_WORK_VOLUME: ${COMPOSE_PROJECT_NAME:-melete}_work
      MELETE_DEFAULT_PROVIDER: ${MELETE_DEFAULT_PROVIDER:-fireworks}
      MELETE_DEFAULT_MODEL: ${MELETE_DEFAULT_MODEL:-accounts/fireworks/models/deepseek-v4p1-flash}
      MELETE_DEFAULT_MAX_OUTPUT_TOKENS: ${MELETE_DEFAULT_MAX_OUTPUT_TOKENS:-4096}
      # Left empty, the service's own defaults apply (docs/DEPLOYMENT.md, "Engine limits").
      MELETE_ENGINE_MAX_TURNS: ${MELETE_ENGINE_MAX_TURNS:-}
      MELETE_COMPACTION_MAX_TOKENS: ${MELETE_COMPACTION_MAX_TOKENS:-}
      MELETE_MODEL_CONTEXT_WINDOW: ${MELETE_MODEL_CONTEXT_WINDOW:-}
      MELETE_PUBLIC_URL: ${MELETE_PUBLIC_URL:-}
      MELETE_ENABLE_FAKE_PROVIDER: ${MELETE_ENABLE_FAKE_PROVIDER:-false}
      MELETE_ENABLE_TEST_CONNECTOR: ${MELETE_ENABLE_TEST_CONNECTOR:-false}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      MELETE_CHATGPT_CLIENT_ID: ${MELETE_CHATGPT_CLIENT_ID:-}
      OPENAI_COMPAT_OAUTH_ISSUER: ${OPENAI_COMPAT_OAUTH_ISSUER:-}
      OPENAI_COMPAT_OAUTH_AUTHORIZE_URL: ${OPENAI_COMPAT_OAUTH_AUTHORIZE_URL:-}
      OPENAI_COMPAT_OAUTH_TOKEN_URL: ${OPENAI_COMPAT_OAUTH_TOKEN_URL:-}
      OPENAI_COMPAT_OAUTH_REVOKE_URL: ${OPENAI_COMPAT_OAUTH_REVOKE_URL:-}
      OPENAI_COMPAT_OAUTH_CLIENT_ID: ${OPENAI_COMPAT_OAUTH_CLIENT_ID:-}
      OPENAI_COMPAT_OAUTH_CLIENT_SECRET: ${OPENAI_COMPAT_OAUTH_CLIENT_SECRET:-}
      OPENAI_COMPAT_OAUTH_SCOPES: ${OPENAI_COMPAT_OAUTH_SCOPES:-}
      OPENAI_COMPAT_OAUTH_REDIRECT_URL: ${OPENAI_COMPAT_OAUTH_REDIRECT_URL:-}
      OPENAI_COMPAT_OAUTH_LABEL: ${OPENAI_COMPAT_OAUTH_LABEL:-}
    group_add: ["10001", "${DOCKER_GID:?run bun run deploy/scripts/configure.ts}"]
    volumes:
      - spaces:/data/spaces
      - artifacts:/data/artifacts
      - work:/work
      - restrictions:/data/restrictions
      - ./config:/etc/melete:ro
      # Trusted supervisor only. No runtime cell is given this socket.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${MELETE_PORT:-3100}:8787"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://melete-api:8787/health');const b=await r.json();process.exit(r.ok&&b.database==='ok'?0:1)"]
      interval: 2s
      timeout: 5s
      start_period: 30s
      retries: 30
    stop_grace_period: 40s

  # Builds the runtime image before the service can launch an attempt from it.
  # Nothing runs here: no engine, no credential, no network.
  runtime-image:
    image: melete-runtime:local
    build:
      context: ../packages/runtime-hermes
      dockerfile: Dockerfile
    entrypoint: ["/bin/true"]
    network_mode: none
    restart: "no"
    logging: *bounded-logs

  runtime:
    image: melete-runtime:local
    restart: unless-stopped
    logging: *bounded-logs
    networks: [internal]
    depends_on:
      runtime-image:
        condition: service_completed_successfully
      melete:
        condition: service_healthy
    environment:
      MELETE_BROKER_URL: http://melete:8788
      HTTP_PROXY: http://melete:8788
      HTTPS_PROXY: http://melete:8788
      NO_PROXY: melete,localhost,127.0.0.1
      HERMES_EXEC_ASK: "1"
      HERMES_HOME: /var/lib/hermes
      API_SERVER_ENABLED: "1"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8790"
      API_SERVER_KEY: ${MELETE_RUNTIME_KEY:?run bun run deploy/scripts/configure.ts}
      # This warm cell has no valid capability and cannot act on a job.
      MELETE_MODEL_KEY: melete-surrogate-probe
      MELETE_ATTEMPT_TOKEN: probe-without-authority
      MELETE_ATTEMPT_ID: att_probe
      MELETE_JOB_ID: job_probe
      MELETE_MODEL_PROVIDER: ${MELETE_DEFAULT_PROVIDER:-fireworks}
      MELETE_MODEL_NAME: ${MELETE_DEFAULT_MODEL:-accounts/fireworks/models/deepseek-v4p1-flash}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: volume
        source: work
        target: /work
        volume:
          nocopy: true
          subpath: _probe
      - runtime-home:/var/lib/hermes
    healthcheck:
      test: ["CMD", "python", "/opt/melete-runtime/healthcheck.py"]
      interval: 2s
      timeout: 5s
      start_period: 60s
      retries: 30

  web:
    image: melete-web:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_MELETE_API: /api
    restart: unless-stopped
    logging: *bounded-logs
    networks: [edge]
    depends_on:
      melete:
        condition: service_healthy
    environment:
      MELETE_WEB_ORIGIN: ${MELETE_WEB_ORIGIN:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3101}:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:3000/')).ok?0:1)"]
      interval: 2s
      timeout: 5s
      retries: 30
