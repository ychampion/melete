# Add to the base file with -f docker-compose.yml -f docker-compose.tailscale.yml.
# One Tailscale node joins your tailnet and serves the web client over HTTPS at
# https://<hostname>.<tailnet>.ts.net. It publishes no host port, joins the edge
# network only, and Funnel stays off, so the installation answers your own
# devices and nothing on the public internet.
#
# Userspace networking is the default here, so the node needs no /dev/net/tun
# and no added capability; deploy/docker-compose.tailscale-kernel.yml is the
# opt-in for kernel networking.
volumes:
  # The node key, so the node keeps its identity and its certificate across
  # restarts. Losing it means authenticating the node again, nothing else.
  tailscale-state:

services:
  web:
    environment:
      # The one peer whose X-Forwarded-For the web server believes, so sign-in
      # limits see each tailnet device rather than one shared socket peer.
      MELETE_WEB_TRUSTED_UPSTREAM: tailscale

  tailscale:
    image: tailscale/tailscale:v1.102.3@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
    restart: unless-stopped
    # The same bound as the base file's services; an anchor cannot cross files.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    environment:
      # Paste an auth key into deploy/.env. It is read from the environment and
      # never written into this file or into the serve configuration.
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in deploy/.env}
      TS_HOSTNAME: ${TS_HOSTNAME:-melete}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /etc/tailscale/serve.json
      # Netstack rather than a TUN device: no kernel networking privileges.
      TS_USERSPACE: "true"
      # Keep Docker's resolver, which is what resolves the web service name.
      TS_ACCEPT_DNS: "false"
      # After the node has joined, a restart reuses the stored node key.
      TS_AUTH_ONCE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      # Loopback inside the container, so no edge peer can reach it.
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
      # Optional node flags, for example --advertise-tags=tag:melete
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    tmpfs:
      - /tmp:size=64m,mode=1777
      # The daemon creates its local API socket directory here at startup.
      - /var/run:size=8m,mode=0755
    volumes:
      - tailscale-state:/var/lib/tailscale
      # Read only, and the one file: the node receives no other configuration.
      - ./config/tailscale-serve.json:/etc/tailscale/serve.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
